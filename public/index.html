<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050817" />
    <link rel="preload" href="/fonts/STIXTwoText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/STIXTwoText-Bold.woff2" as="font" type="font/woff2" crossorigin />
<style>
      /* One typography source for both the browser build and the Android WebView APK. */
      /*
       * STIX Two Text is the only application typeface.
       * The app uses many UI weights (750–950), but the APK ships only
       * the real Regular and Bold STIX faces. Map the full weight ranges
       * to those bundled faces so Android WebView never falls back to a
       * device font for an unsupported weight.
       */
      @font-face {
        font-family: "STIX Two Text";
        src: url("/fonts/STIXTwoText-Regular.woff2") format("woff2");
        font-weight: 100 699;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: "STIX Two Text";
        src: url("/fonts/STIXTwoText-Bold.woff2") format("woff2");
        font-weight: 700 1000;
        font-style: normal;
        font-display: block;
      }

      :root {
        --kingshall-global-font: "STIX Two Text";
      }

      html,
      body,
      #root,
      *,
      *::before,
      *::after,
      button,
      input,
      textarea,
      select,
      option {
        font-family: "STIX Two Text" !important;
        font-synthesis: none !important;
      }

      /* Keep the same font family even when Android WebView creates native-looking form controls. */
      input,
      textarea,
      select,
      button {
        font-family: var(--kingshall-global-font) !important;
      }

      /* Prevent mobile browsers from showing a tap highlight on interactions. */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html,
      body,
      #root,
      * {
        scrollbar-width: none !important;
        scrollbar-color: transparent transparent !important;
        -ms-overflow-style: none !important;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar,
      *::-webkit-scrollbar,
      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb,
      #root::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb,
      html::-webkit-scrollbar-track,
      body::-webkit-scrollbar-track,
      #root::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track,
      html::-webkit-scrollbar-corner,
      body::-webkit-scrollbar-corner,
      #root::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        min-width: 0 !important;
        min-height: 0 !important;
        border: 0 !important;
        background: transparent !important;
        color: transparent !important;
      }

      input,
      textarea,
      select,
      [contenteditable='true'],
      [contenteditable=''] {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }

      html {
        background: #e7e4de;
        font-family: "STIX Two Text" !important;
        font-synthesis: none !important;
      }

      html[data-theme='dark'] {
        background: #000000;
      }

      .initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        width: 100vw;
        height: 100dvh;
        min-height: 100vh;
        overflow: hidden;
        background: #e7e4de;
        color: #151515;
      }

      html[data-theme='dark'] .initial-splash {
        background: #000000;
        color: #ffffff;
      }

      body {
        background: #e7e4de;
      }

      html[data-theme='dark'] body {
        background: #000000;
      }

      .initial-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      .initial-splash-logo-circle {
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        flex: 0 0 92px;
        box-sizing: border-box;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 50%;
        background: #000000;
        box-shadow: none;
      }

      .initial-splash-logo {
        display: block;
        width: 72px;
        height: 72px;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: center center;
      }

      .initial-splash-title {
        margin: 0;
        color: inherit;
        font: inherit;
        font-size: 13px;
        line-height: 1.4;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .initial-splash-powered {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom) + 28px);
        z-index: 10001;
        display: block;
        margin: 0;
        padding: 0 16px;
        box-sizing: border-box;
        color: inherit;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: 0.08em;
        opacity: 0.72;
        text-align: center;
        text-transform: none;
        pointer-events: none;
      }

.initial-splash-shimmer {
        position: relative;
        contain: paint;
        width: 180px;
        height: 3px;
        margin-top: -8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        isolation: isolate;
      }
      .initial-splash-shimmer::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        transform: translate3d(-130%, 0, 0);
        backface-visibility: hidden;
        will-change: transform;
        animation: initial-splash-shimmer 1.15s linear infinite !important;
        animation-play-state: running !important;
      }
      @keyframes initial-splash-shimmer {
        0% { transform: translate3d(-100%, 0, 0); }
        100% { transform: translate3d(240%, 0, 0); }
      }

      /* Keep clipboard-pasted and browser-autofilled fields aligned with the selected theme. */
      html[data-theme='dark'] input:-webkit-autofill,
      html[data-theme='dark'] input:-webkit-autofill:hover,
      html[data-theme='dark'] input:-webkit-autofill:focus,
      html[data-theme='dark'] input:-webkit-autofill:active,
      html[data-theme='dark'] textarea:-webkit-autofill,
      html[data-theme='dark'] textarea:-webkit-autofill:hover,
      html[data-theme='dark'] textarea:-webkit-autofill:focus,
      html[data-theme='dark'] select:-webkit-autofill,
      html[data-theme='dark'] select:-webkit-autofill:hover,
      html[data-theme='dark'] select:-webkit-autofill:focus,
      html[data-theme='dark'] input:autofill,
      html[data-theme='dark'] textarea:autofill,
      html[data-theme='dark'] select:autofill {
        -webkit-text-fill-color: #f4f4f4 !important;
        caret-color: #f4f4f4 !important;
        -webkit-box-shadow: 0 0 0 1000px #050816 inset !important;
        box-shadow: 0 0 0 1000px #050816 inset !important;
        background-color: #050816 !important;
        color: #f4f4f4 !important;
        transition: background-color 999999s ease-out 0s !important;
      }
      html:not([data-theme='dark']) input:-webkit-autofill,
      html:not([data-theme='dark']) input:-webkit-autofill:hover,
      html:not([data-theme='dark']) input:-webkit-autofill:focus,
      html:not([data-theme='dark']) input:-webkit-autofill:active,
      html:not([data-theme='dark']) textarea:-webkit-autofill,
      html:not([data-theme='dark']) textarea:-webkit-autofill:hover,
      html:not([data-theme='dark']) textarea:-webkit-autofill:focus,
      html:not([data-theme='dark']) select:-webkit-autofill,
      html:not([data-theme='dark']) select:-webkit-autofill:hover,
      html:not([data-theme='dark']) select:-webkit-autofill:focus,
      html:not([data-theme='dark']) input:autofill,
      html:not([data-theme='dark']) textarea:autofill,
      html:not([data-theme='dark']) select:autofill {
        -webkit-text-fill-color: #151515 !important;
        caret-color: #151515 !important;
        -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
        box-shadow: 0 0 0 1000px #ffffff inset !important;
        background-color: #ffffff !important;
        color: #151515 !important;
        transition: background-color 999999s ease-out 0s !important;
      }

    </style>

    <!-- Set theme before the first paint to prevent the splash from flashing light. -->
    <script>
      (() => {
        const root = document.documentElement;
        const preferenceKey = 'kingshall_app_theme_preference';
        const legacyKey = 'kingshall_app_theme';
        let preference = null;

        try {
          preference = localStorage.getItem(preferenceKey);
          if (!preference) {
            preference = localStorage.getItem(legacyKey);
          }
        } catch (error) {
          // Use the dark default when storage is unavailable (for example, in private browsing).
        }

        let mode = preference === 'light' || preference === 'dark' ? preference : 'dark';
        if (preference === 'system') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } else if (preference === 'shift') {
          const hour = new Date().getHours();
          mode = hour >= 6 && hour < 18 ? 'light' : 'dark';
        }

        root.setAttribute('data-theme', mode);
        root.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', mode === 'dark' ? '#000000' : '#e7e4de');
      })();

      window.__kingshallRefreshSplash = performance.getEntriesByType('navigation')[0]?.type === 'reload';

      document.addEventListener('contextmenu', (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;

        if (target.closest('input, textarea, select, [contenteditable="true"], [contenteditable=""]')) return;
        event.preventDefault();
      });
    </script>

    <!-- 🔥 SEO & Branding Meta -->
    <title>CryBots | Crypto Trading Bots</title>
    <meta name="description" content="CryBots is a crypto trading bot platform built for automated trading strategies and portfolio management.">

    <link rel="icon" href="%PUBLIC_URL%/icons/crybots-app-icon.svg?v=7" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/crybots-app-icon.svg?v=7" />

    <!-- TrustBox script -->
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
    <!-- End TrustBox script -->
  </head>
  <body style="margin: 0; overflow-x: hidden;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="initial-splash" class="initial-splash" aria-label="Loading CryBots">
      <div class="initial-splash-card">
        <div class="initial-splash-logo-circle"><img class="initial-splash-logo" src="%PUBLIC_URL%/icons/ke-foreground.svg?v=1" alt="CryBots" /></div>
        <p class="initial-splash-title">CryBots</p>
        <div class="initial-splash-shimmer" aria-hidden="true"></div>
      </div>
      <p class="initial-splash-powered">Powered by KingsHall</p>
    </div>
    <div id="root" style="min-height: 100vh;"></div>
  </body>
</html>
