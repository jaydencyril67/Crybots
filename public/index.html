<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Set theme before React loads to prevent flicker -->
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    </script>

    <!-- 🔥 SEO & Branding Meta -->
    <title>KingsHall Exchange | Modern Crypto Trading & Investing</title>
    <meta name="description" content="KingsHall Exchange is a modern crypto exchange and investment app built for secure trading, fast transfers, and premium portfolio growth.">
    <meta name="keywords" content="KingsHall Exchange, crypto exchange, crypto investing, bitcoin, ethereum, digital assets, secure trading, portfolio growth">
    <meta name="author" content="KingsHall Exchange">
    <meta name="robots" content="index, follow" />

    <!-- 📱 Social Sharing (OG Tags) -->
    <meta property="og:title" content="KingsHall Exchange" />
    <meta property="og:description" content="Invest smarter with KingsHall Exchange. A sleek crypto platform with fast deposits, secure trading, and modern portfolio tools." />
    <meta property="og:image" content="%PUBLIC_URL%/tradespot.jpeg" />
    <meta property="og:url" content="https://www.kingshall.exchange" />
    <meta property="og:type" content="website" />

    <!-- 🐦 Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KingsHall Exchange" />
    <meta name="twitter:description" content="Invest smarter with KingsHall Exchange. Trusted crypto exchange with security, speed, and premium investing tools." />
    <meta name="twitter:image" content="%PUBLIC_URL%/tradespot.jpeg" />

    <!-- ✅ JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KingsHall Exchange",
      "url": "https://www.kingshall.exchange",
      "logo": "https://www.kingshall.exchange/tradespot.jpeg",
      "sameAs": [
        "https://twitter.com/yourTwitterHandle",
        "https://www.instagram.com/yourInstagramHandle",
        "https://www.linkedin.com/company/yourLinkedInHandle"
      ]
    }
    </script>

    <!-- 👋 Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/tradespot.jpeg" />

    <!-- TrustBox script -->
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
    <!-- End TrustBox script -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
