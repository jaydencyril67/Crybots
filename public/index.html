<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050816" />
    <style>
      /* Prevent mobile browsers from showing a tap highlight on interactions. */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background: #e7e4de;
      }

      html[data-theme='dark'] {
        background: #000000;
      }

      .initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e7e4de;
        color: #151515;
      }

      html[data-theme='dark'] .initial-splash {
        background: #000000;
        color: #ffffff;
      }

      body {
        background: #e7e4de;
      }

      html[data-theme='dark'] body {
        background: #000000;
      }

      .initial-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      .initial-splash-logo {
        width: 95px;
        height: auto;
        display: block;
      }

      .initial-splash-title {
        margin: 0;
        color: inherit;
        font: 13px/1.4 sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .initial-splash-shimmer {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
        animation: initial-splash-shimmer 1.4s ease-in-out infinite;
      }

      @keyframes initial-splash-shimmer {
        0%, 100% { transform: scaleX(0.72); opacity: 0.45; }
        50% { transform: scaleX(1); opacity: 1; }
      }
    </style>

    <!-- Set theme before the first paint to prevent the splash from flashing light. -->
    <script>
      (() => {
        const root = document.documentElement;
        const preferenceKey = 'kingshall_app_theme_preference';
        const legacyKey = 'kingshall_app_theme';
        let preference = null;

        try {
          preference = localStorage.getItem(preferenceKey);
          if (!preference) {
            preference = localStorage.getItem(legacyKey);
          }
        } catch (error) {
          // Use the dark default when storage is unavailable (for example, in private browsing).
        }

        let mode = preference === 'light' || preference === 'dark' ? preference : 'dark';
        if (preference === 'system') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } else if (preference === 'shift') {
          const hour = new Date().getHours();
          mode = hour >= 6 && hour < 18 ? 'light' : 'dark';
        }

        root.setAttribute('data-theme', mode);
        root.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', mode === 'dark' ? '#000000' : '#e7e4de');
      })();

      window.__kingshallRefreshSplash = performance.getEntriesByType('navigation')[0]?.type === 'reload';
    </script>

    <!-- 🔥 SEO & Branding Meta -->
    <title>KingsHall Exchange | Modern Crypto Trading & Investing</title>
    <meta name="description" content="KingsHall Exchange is a modern crypto exchange and investment app built for secure trading, fast transfers, and premium portfolio growth.">
    <meta name="keywords" content="KingsHall Exchange, crypto exchange, crypto investing, bitcoin, ethereum, digital assets, secure trading, portfolio growth">
    <meta name="author" content="KingsHall Exchange">
    <meta name="robots" content="index, follow" />

    <!-- 📱 Social Sharing (OG Tags) -->
    <meta property="og:title" content="KingsHall Exchange" />
    <meta property="og:description" content="Invest smarter with KingsHall Exchange. A sleek crypto platform with fast deposits, secure trading, and modern portfolio tools." />
    <meta property="og:image" content="%PUBLIC_URL%/icons/ke-icon.svg" />
    <meta property="og:url" content="https://www.kingshall.exchange" />
    <meta property="og:type" content="website" />

    <!-- 🐦 Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KingsHall Exchange" />
    <meta name="twitter:description" content="Invest smarter with KingsHall Exchange. Trusted crypto exchange with security, speed, and premium investing tools." />
    <meta name="twitter:image" content="%PUBLIC_URL%/icons/ke-icon.svg" />

    <!-- ✅ JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KingsHall Exchange",
      "url": "https://www.kingshall.exchange",
      "logo": "https://www.kingshall.exchange/icons/ke-icon.svg",
      "sameAs": [
        "https://twitter.com/yourTwitterHandle",
        "https://www.instagram.com/yourInstagramHandle",
        "https://www.linkedin.com/company/yourLinkedInHandle"
      ]
    }
    </script>

    <!-- 👋 Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/icons/ke-icon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/ke-icon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- TrustBox script -->
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
    <!-- End TrustBox script -->
  </head>
  <body style="margin: 0; overflow-x: hidden;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="initial-splash" class="initial-splash" aria-label="Loading KingsHall Exchange">
      <div class="initial-splash-card">
        <img class="initial-splash-logo" src="%PUBLIC_URL%/icons/ke-icon.svg" alt="KingsHall" />
        <p class="initial-splash-title">KingsHall Exchange</p>
        <div class="initial-splash-shimmer" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root" style="min-height: 100vh;"></div>
  </body>
</html>
