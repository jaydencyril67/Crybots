name: Notify CryBots users about a published APK release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-users:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Broadcast update through the existing notification system
        env:
          API_URL: ${{ vars.CRYBOTS_API_URL || 'https://kingshalls.onrender.com' }}
          RELEASE_SECRET: ${{ secrets.CRYBOTS_RELEASE_WEBHOOK_SECRET }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SECRET" ]; then
            echo "::error::Set CRYBOTS_RELEASE_WEBHOOK_SECRET in GitHub Actions secrets and Render environment variables before publishing releases."
            exit 1
          fi
          payload="$(jq -n --arg tag "$RELEASE_TAG" '{tag: $tag}')"
          curl --fail-with-body --silent --show-error \
            --request POST "$API_URL/api/notifications/release-published" \
            --header "Content-Type: application/json" \
            --header "X-CryBots-Release-Secret: $RELEASE_SECRET" \
            --data "$payload"
