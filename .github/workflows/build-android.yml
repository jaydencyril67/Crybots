name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@7.6.9 @capacitor/android@7.6.9 @capacitor/cli@7.6.9 @capacitor/assets@3.0.5 @capacitor/splash-screen@7.0.3 @capacitor-community/text-to-speech@6.0.0 @capacitor/camera@7.0.2 sharp

      - name: Create app splash assets
        run: |
          mkdir -p assets
          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const source = fs.readFileSync('public/icons/ke-icon.svg', 'utf8');
          const logo = source.replace(
            /<svg[^>]*>/,
            '<svg width="400" height="400" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">',
          );
          const crown = logo.replace(/<rect[^>]*\/>/, '');
          const splash = `<svg width="2732" height="2732" viewBox="0 0 2732 2732" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><rect width="2732" height="2732" fill="#000000"/><circle cx="1366" cy="1366" r="185" fill="#111827"/><g transform="translate(1366 1366) scale(0.64 0.56) translate(-256 -256)">${crown.replace('<svg', '<g').replace('</svg>', '</g>')}</g></svg>`;
          fs.writeFileSync('assets/splash.svg', splash);
          fs.writeFileSync('assets/crown.svg', logo);
          sharp('public/icons/ke-icon.svg').resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon-only.png')
            .then(() => sharp('assets/crown.svg').resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon-foreground.png'))
            .then(() => sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#111827' } }).png().toFile('assets/icon-background.png'))
            .then(() => sharp('assets/splash.svg').png().toFile('assets/splash.png'))
            .catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Build web app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://kingshalls.onrender.com' }}

      - name: Create Android project and generate splash assets
        run: |
          npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(file, 'utf8');
          const permissions = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'];
          const missing = permissions.filter(permission => !manifest.includes(permission));
          if (missing.length) {
            const lines = missing.map(permission => `    <uses-permission android:name="${permission}" />`).join('\n');
            manifest = manifest.replace(/(<manifest[^>]*>\n)/, `$1${lines}\n`);
          }
          fs.writeFileSync(file, manifest);
          NODE
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
