name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Confirm that you intentionally want to build the debug APK'
        required: true
        default: false
        type: boolean

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@7.6.9 @capacitor/android@7.6.9 @capacitor/cli@7.6.9 @capacitor/assets@3.0.5 @capacitor/splash-screen@7.0.3 @capacitor-community/text-to-speech@6.0.0 @capacitor/camera@7.0.2 sharp

      - name: Create app splash assets
        run: |
          mkdir -p assets
          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const source = fs.readFileSync('public/icons/ke-icon.svg', 'utf8');
          const logo = source.replace(
            /<svg[^>]*>/,
            '<svg width="400" height="400" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">',
          );
          const crown = logo;

          // Keep the native splash visually aligned with the canonical CryBots logo:
          // black canvas, centered KingsHall mark, title and loading bar.
          const splash = `<svg width="2732" height="2732" viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
            <rect width="2732" height="2732" fill="#000000"/>
            <g transform="translate(1366 980) scale(1.34 1.34) translate(-256 -256)">
              ${crown.replace('<svg', '<g').replace('</svg>', '</g>')}
            </g>
            <text x="1366" y="1550" text-anchor="middle" fill="#ffffff" font-family="STIX Two Text" font-size="112" letter-spacing="12">CRYBOTS</text>
      <text x="1366" y="1640" text-anchor="middle" fill="#ffffff" font-family="STIX Two Text" font-size="48" letter-spacing="5">Powered by KingsHall</text>
      <rect x="686" y="1715" width="1360" height="22" rx="11" fill="#ffffff"/>
          </svg>`;
          fs.writeFileSync('assets/splash.svg', splash);
          fs.writeFileSync('assets/icon.svg', logo);

          sharp('public/icons/ke-icon.svg').resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon-only.png')
            .then(() => sharp('assets/icon.svg').resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon-foreground.png'))
            .then(() => sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#111827' } }).png().toFile('assets/icon-background.png'))
            .then(() => sharp('assets/splash.svg').png().toFile('assets/splash.png'))
            .catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Build web app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://kingshalls.onrender.com' }}

      - name: Create Android project and generate splash assets
        run: |
          npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(file, 'utf8');
          const permissions = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'];
          const missing = permissions.filter(permission => !manifest.includes(permission));
          if (missing.length) {
            const lines = missing.map(permission => `    <uses-permission android:name="${permission}" />`).join('\\n');
            manifest = manifest.replace(/(<manifest[^>]*>\n)/, `$1${lines}\n`);
          }
          fs.writeFileSync(file, manifest);
          NODE
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
