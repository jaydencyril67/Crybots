name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Intentionally build the debug APK
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-apk:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install dependencies
        run: npm ci
      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@7.6.9 @capacitor/android@7.6.9 @capacitor/cli@7.6.9 @capacitor/assets@3.0.5 @capacitor/splash-screen@7.0.3 @capacitor-community/text-to-speech@6.0.0 @capacitor/camera@7.0.2 sharp
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android && npx cap sync android
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          additions='\n'.join(['    <uses-permission android:name="android.permission.INTERNET" />','    <uses-permission android:name="android.permission.RECORD_AUDIO" />','    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'])
          pos=s.find('>')+1
          missing=[x for x in additions.split('\n') if x not in s]
          if missing: p.write_text(s[:pos]+'\n'+'\n'.join(missing)+s[pos:])
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crybots-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
