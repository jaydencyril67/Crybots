name: Generate Android Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate permanent signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using the configured GitHub secret passwords."
          else
            KEYSTORE_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"
            KEY_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"
          fi
          keytool -genkeypair \
            -v \
            -keystore kingshall-release.keystore \
            -alias kingshall \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KingsHall Exchange, OU=Mobile, O=KingsHall Exchange, L=Unknown, ST=Unknown, C=US"
          {
            echo "ANDROID_KEY_ALIAS=kingshall"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > kingshall-signing-credentials.txt

      - name: Upload keystore and credentials
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-release-signing-files
          path: |
            kingshall-release.keystore
            kingshall-signing-credentials.txt
          retention-days: 1
