name: Generate Android Release Keystore

on:
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: 'Confirm that you intentionally want to generate signing credentials'
        required: true
        default: false
        type: boolean

jobs:
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_keystore == true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate permanent signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using the configured GitHub secret passwords."
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          keytool -genkeypair \
            -v \
            -keystore kingshall-release.keystore \
            -alias kingshall \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype PKCS12 \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CryBots, OU=Mobile, O=CryBots, L=Unknown, ST=Unknown, C=US"
          {
            echo "ANDROID_KEY_ALIAS=kingshall"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > kingshall-signing-credentials.txt

      - name: Upload keystore and credentials
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-release-signing-files
          path: |
            kingshall-release.keystore
            kingshall-signing-credentials.txt
          retention-days: 90
