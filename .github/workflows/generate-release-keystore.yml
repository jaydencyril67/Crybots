name: Generate Android Release Keystore

on:
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: Intentionally generate a new release signing credential
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate-keystore:
    if: inputs.generate_keystore == true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate release signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then KEYSTORE_PASSWORD="$(openssl rand -hex 24)"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi
          keytool -genkeypair -v -keystore kingshall-release.keystore -alias kingshall -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 -keypass "$KEY_PASSWORD" -dname "CN=CryBots, OU=Mobile, O=CryBots, L=Unknown, ST=Unknown, C=US"
          printf 'ANDROID_KEY_ALIAS=kingshall\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > kingshall-signing-credentials.txt
      - name: Upload release signing files
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-release-signing-files
          path: |
            kingshall-release.keystore
            kingshall-signing-credentials.txt
          retention-days: 90
