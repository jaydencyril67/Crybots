name: Build Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Intentionally build the production APK
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-release:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install dependencies
        run: npm ci
      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@7.6.9 @capacitor/android@7.6.9 @capacitor/cli@7.6.9 @capacitor/assets@3.0.5 @capacitor/splash-screen@7.0.3 @capacitor-community/text-to-speech@6.0.0 @capacitor/camera@7.0.2 sharp
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android && npx cap sync android
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          items=['    <uses-permission android:name="android.permission.INTERNET" />','    <uses-permission android:name="android.permission.RECORD_AUDIO" />','    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />']
          pos=s.find('>')+1
          missing=[x for x in items if x not in s]
          if missing: p.write_text(s[:pos]+'\n'+'\n'.join(missing)+s[pos:])
          PY
      - name: Prepare release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          id="$(gh run list --workflow generate-release-keystore.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$id" ]; then gh run download "$id" --name kingshall-release-signing-files --dir signing || true; fi
          if [ ! -s signing/kingshall-release.keystore ] || [ ! -s signing/kingshall-signing-credentials.txt ]; then
            password="$(openssl rand -hex 24)"
            keytool -genkeypair -keystore signing/kingshall-release.keystore -alias kingshall -keyalg RSA -keysize 2048 -validity 10000 -storepass "$password" -storetype PKCS12 -keypass "$password" -dname "CN=CryBots, OU=Mobile, O=CryBots, L=Unknown, ST=Unknown, C=US"
            printf 'ANDROID_KEY_ALIAS=kingshall\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\n' "$password" "$password" > signing/kingshall-signing-credentials.txt
          fi
      - name: Configure release signing
        run: |
          set -euo pipefail
          source signing/kingshall-signing-credentials.txt
          cp signing/kingshall-release.keystore android/app/kingshall-release.keystore
          printf 'KINGS_HALL_KEYSTORE_FILE=kingshall-release.keystore\nKINGS_HALL_KEYSTORE_PASSWORD=%s\nKINGS_HALL_KEY_ALIAS=%s\nKINGS_HALL_KEY_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" >> android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'signingConfigs {' not in s:
              block='''\n    signingConfigs {\n        release {\n            storeFile file(project.findProperty("KINGS_HALL_KEYSTORE_FILE"))\n            storePassword project.findProperty("KINGS_HALL_KEYSTORE_PASSWORD")\n            keyAlias project.findProperty("KINGS_HALL_KEY_ALIAS")\n            keyPassword project.findProperty("KINGS_HALL_KEY_PASSWORD")\n        }\n    }\n'''
              s=s.replace('    buildTypes {',block+'    buildTypes {',1)
          start=s.find('    buildTypes {')
          rel=s.find('        release {',start)
          if rel < 0: raise SystemExit('release build type not found')
          if 'signingConfig signingConfigs.release' not in s[rel:rel+250]: s=s[:rel]+s[rel:].replace('        release {','        release {\n            signingConfig signingConfigs.release',1)
          p.write_text(s)
          PY
      - name: Build signed production APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: crybots-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
