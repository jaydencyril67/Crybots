name: Build Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the CryBots production APK'
        required: true
        default: false
        type: boolean
      app_version:
        description: 'CryBots Android version name (use the same version for the GitHub Release tag, without the v)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: crybots-release-apk
  cancel-in-progress: true

jobs:
  build-release:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CryBots
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm ci

      - name: Install pinned Android build dependencies
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7.6.9 \
            @capacitor/android@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/assets@3.0.5 \
            @capacitor/splash-screen@7.0.3 \
            @capacitor-community/text-to-speech@6.0.0 \
            sharp

      - name: Verify CryBots web build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://kingshalls.onrender.com' }}
        run: npm run build

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Set CryBots Android version
        env:
          APP_VERSION: ${{ inputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["APP_VERSION"].strip()
          version_code = os.environ["APP_VERSION_CODE"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must use semantic version format such as 1.0.0")

          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+\s*$", f"        versionCode {version_code}", text, count=1)
          text, name_count = re.subn(r"""(?m)^\s*versionName\s+[\"'][^\"']*[\"']\s*$""", f'        versionName "{version}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode and versionName")
          path.write_text(text)
          print(f"Configured CryBots version {version} (versionCode {version_code})")
          PY
      - name: Add Android WebAuthn and Credential Manager support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          deps = '''\n    implementation "androidx.webkit:webkit:1.14.0"\n    implementation "androidx.credentials:credentials:1.6.0"\n    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"\n'''
          marker = "dependencies {\n"
          if marker not in text:
              raise SystemExit("Could not find Android dependencies block")
          if "androidx.webkit:webkit" not in text:
              text = text.replace(marker, marker + deps, 1)
          path.write_text(text)
          PY

          mkdir -p android/app/src/main/java/com/kingshall/exchange
          cat > android/app/src/main/java/com/kingshall/exchange/NativeWebAuthnPlugin.java <<'JAVA'
          package com.kingshall.exchange;

          import android.os.CancellationSignal;
          import androidx.credentials.CreateCredentialRequest;
          import androidx.credentials.CreateCredentialResponse;
          import androidx.credentials.Credential;
          import androidx.credentials.CredentialManager;
          import androidx.credentials.CredentialManagerCallback;
          import androidx.credentials.GetCredentialRequest;
          import androidx.credentials.GetCredentialResponse;
          import androidx.credentials.exceptions.CreateCredentialException;
          import androidx.credentials.exceptions.GetCredentialException;
          import androidx.credentials.CreatePublicKeyCredentialRequest;
          import androidx.credentials.CreatePublicKeyCredentialResponse;
          import androidx.credentials.GetPublicKeyCredentialOption;
          import androidx.credentials.PublicKeyCredential;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;
          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "NativeWebAuthn")
          public class NativeWebAuthnPlugin extends Plugin {
              private final Executor executor = Executors.newSingleThreadExecutor();

              @PluginMethod
              public void create(PluginCall call) {
                  String options = call.getString("options");
                  if (options == null || options.isEmpty()) {
                      call.reject("WebAuthn registration options are required.");
                      return;
                  }
                  CreatePublicKeyCredentialRequest request = new CreatePublicKeyCredentialRequest(options);
                  CredentialManager manager = CredentialManager.create(getContext());
                  manager.createCredentialAsync(getActivity(), request, new CancellationSignal(), executor,
                          new CredentialManagerCallback<CreateCredentialResponse, CreateCredentialException>() {
                              @Override public void onResult(CreateCredentialResponse result) {
                                  if (!(result instanceof CreatePublicKeyCredentialResponse)) {
                                      call.reject("Android did not return a public-key credential.");
                                      return;
                                  }
                                  JSObject response = new JSObject();
                                  response.put("responseJson", ((CreatePublicKeyCredentialResponse) result).getRegistrationResponseJson());
                                  call.resolve(response);
                              }
                              @Override public void onError(CreateCredentialException error) {
                                  call.reject(error.getMessage() == null ? "Android passkey registration failed." : error.getMessage());
                              }
                          });
              }

              @PluginMethod
              public void get(PluginCall call) {
                  String options = call.getString("options");
                  if (options == null || options.isEmpty()) {
                      call.reject("WebAuthn authentication options are required.");
                      return;
                  }
                  GetPublicKeyCredentialOption option = new GetPublicKeyCredentialOption(options);
                  GetCredentialRequest request = new GetCredentialRequest.Builder().addCredentialOption(option).build();
                  CredentialManager manager = CredentialManager.create(getContext());
                  manager.getCredentialAsync(getActivity(), request, new CancellationSignal(), executor,
                          new CredentialManagerCallback<GetCredentialResponse, GetCredentialException>() {
                              @Override public void onResult(GetCredentialResponse result) {
                                  Credential credential = result.getCredential();
                                  if (!(credential instanceof PublicKeyCredential)) {
                                      call.reject("Android did not return a public-key credential.");
                                      return;
                                  }
                                  JSObject response = new JSObject();
                                  response.put("responseJson", ((PublicKeyCredential) credential).getAuthenticationResponseJson());
                                  call.resolve(response);
                              }
                              @Override public void onError(GetCredentialException error) {
                                  call.reject(error.getMessage() == null ? "Android passkey authentication failed." : error.getMessage());
                              }
                          });
              }
          }
          JAVA

      - name: Configure Android media audio routing for voice mode
        run: |
          mkdir -p android/app/src/main/java/com/kingshall/exchange
          cat > android/app/src/main/java/com/kingshall/exchange/MediaAudioPlugin.java <<'JAVA'
          package com.kingshall.exchange;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.os.Build;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          @CapacitorPlugin(name = "MediaAudio")
          public class MediaAudioPlugin extends Plugin {
              private AudioManager audioManager;
              private AudioFocusRequest audioFocusRequest;

              private AudioManager getAudioManager() {
                  if (audioManager == null) {
                      audioManager = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                  }
                  return audioManager;
              }

              @PluginMethod
              public void prepareMediaOutput(PluginCall call) {
                  AudioManager manager = getAudioManager();
                  if (manager == null) {
                      call.resolve();
                      return;
                  }

                  // WebView microphone capture can leave Android in communication/call mode.
                  // Deepgram TTS is normal media playback, so explicitly restore MODE_NORMAL.
                  manager.setMode(AudioManager.MODE_NORMAL);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      AudioAttributes attributes = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build();

                      audioFocusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                              .setAudioAttributes(attributes)
                              .setAcceptsDelayedFocusGain(false)
                              .build();

                      manager.requestAudioFocus(audioFocusRequest);
                  } else {
                      manager.requestAudioFocus(
                              null,
                              AudioManager.STREAM_MUSIC,
                              AudioManager.AUDIOFOCUS_GAIN_TRANSIENT
                      );
                  }

                  call.resolve(new JSObject());
              }

              @PluginMethod
              public void releaseMediaOutput(PluginCall call) {
                  AudioManager manager = getAudioManager();
                  if (manager != null) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && audioFocusRequest != null) {
                          manager.abandonAudioFocusRequest(audioFocusRequest);
                          audioFocusRequest = null;
                      } else {
                          manager.abandonAudioFocus(null);
                      }
                      manager.setMode(AudioManager.MODE_NORMAL);
                  }
                  call.resolve(new JSObject());
              }
          }
          JAVA

          cat > android/app/src/main/java/com/kingshall/exchange/WebAuthnDiagnosticsPlugin.java <<'JAVA'
          package com.kingshall.exchange;

          import android.os.Build;
          import android.webkit.WebView;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.util.Log;

          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewFeature;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          @CapacitorPlugin(name = "WebAuthnDiagnostics")
          public class WebAuthnDiagnosticsPlugin extends Plugin {
              @PluginMethod
              public void getDiagnostics(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("platform", "android");
                  result.put("androidVersion", Build.VERSION.RELEASE);
                  result.put("androidSdkInt", Build.VERSION.SDK_INT);
                  result.put("manufacturer", Build.MANUFACTURER);
                  result.put("model", Build.MODEL);

                  WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                  result.put("webViewAvailable", webView != null);
                  if (webView != null) {
                      result.put("webViewUrl", webView.getUrl() == null ? "" : webView.getUrl());
                      result.put("webViewTitle", webView.getTitle() == null ? "" : webView.getTitle());
                      result.put("webViewJavaScriptEnabled", webView.getSettings().getJavaScriptEnabled());
                  }

                  try {
                      PackageInfo packageInfo = WebView.getCurrentWebViewPackage();
                      if (packageInfo != null) {
                          result.put("webViewPackage", packageInfo.packageName);
                          result.put("webViewVersion", packageInfo.versionName == null ? "" : packageInfo.versionName);
                      } else {
                          result.put("webViewPackage", "unknown");
                      }
                  } catch (Exception error) {
                      result.put("webViewPackageLookupError", error.toString());
                  }

                  boolean supported = WebViewFeature.isFeatureSupported(WebViewFeature.WEB_AUTHENTICATION);
                  result.put("webAuthenticationFeatureSupported", supported);
                  if (supported && webView != null) {
                      try {
                          int support = WebSettingsCompat.getWebAuthenticationSupport(webView.getSettings());
                          result.put("webAuthenticationSupport", support);
                          result.put("webAuthenticationSupportLabel",
                                  support == WebSettingsCompat.WEB_AUTHENTICATION_SUPPORT_FOR_APP ? "WEB_AUTHENTICATION_SUPPORT_FOR_APP" :
                                  support == WebSettingsCompat.WEB_AUTHENTICATION_SUPPORT_FOR_BROWSER ? "WEB_AUTHENTICATION_SUPPORT_FOR_BROWSER" :
                                  support == WebSettingsCompat.WEB_AUTHENTICATION_SUPPORT_NONE ? "WEB_AUTHENTICATION_SUPPORT_NONE" : "UNKNOWN");
                      } catch (Exception error) {
                          result.put("webAuthenticationSupportReadError", error.toString());
                          Log.e("CryBotsWebAuthn", "Unable to read WebAuthn support setting", error);
                      }
                  }
                  call.resolve(result);
              }
          }
          JAVA

          cat > android/app/src/main/java/com/kingshall/exchange/NativeAppUpdatePlugin.java <<'JAVA'
          package com.kingshall.exchange;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInfo;
          import android.database.Cursor;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "NativeAppUpdate")
          public class NativeAppUpdatePlugin extends Plugin {
              private BroadcastReceiver downloadReceiver;
              private long pendingDownloadId = -1L;
              private String pendingDownloadUrl = "";

              private String statusLabel(int status) {
                  if (status == DownloadManager.STATUS_PENDING) return "PENDING";
                  if (status == DownloadManager.STATUS_RUNNING) return "RUNNING";
                  if (status == DownloadManager.STATUS_PAUSED) return "PAUSED";
                  if (status == DownloadManager.STATUS_SUCCESSFUL) return "SUCCESSFUL";
                  if (status == DownloadManager.STATUS_FAILED) return "FAILED";
                  return "UNKNOWN(" + status + ")";
              }

              private String reasonLabel(int reason) {
                  switch (reason) {
                      case DownloadManager.ERROR_CANNOT_RESUME: return "CANNOT_RESUME";
                      case DownloadManager.ERROR_DEVICE_NOT_FOUND: return "DEVICE_NOT_FOUND";
                      case DownloadManager.ERROR_FILE_ALREADY_EXISTS: return "FILE_ALREADY_EXISTS";
                      case DownloadManager.ERROR_FILE_ERROR: return "FILE_ERROR";
                      case DownloadManager.ERROR_HTTP_DATA_ERROR: return "HTTP_DATA_ERROR";
                      case DownloadManager.ERROR_INSUFFICIENT_SPACE: return "INSUFFICIENT_SPACE";
                      case DownloadManager.ERROR_TOO_MANY_REDIRECTS: return "TOO_MANY_REDIRECTS";
                      case DownloadManager.ERROR_UNHANDLED_HTTP_CODE: return "UNHANDLED_HTTP_CODE";
                      case DownloadManager.ERROR_UNKNOWN: return "UNKNOWN";
                      case DownloadManager.PAUSED_QUEUED_FOR_WIFI: return "PAUSED_QUEUED_FOR_WIFI";
                      case DownloadManager.PAUSED_WAITING_FOR_NETWORK: return "PAUSED_WAITING_FOR_NETWORK";
                      case DownloadManager.PAUSED_WAITING_TO_RETRY: return "PAUSED_WAITING_TO_RETRY";
                      default:
                          if (reason >= 400 && reason < 600) return "HTTP_" + reason;
                          return reason == 0 ? "NONE" : "REASON_" + reason;
                  }
              }

              private void emitLog(String stage, String message, JSObject details) {
                  JSObject event = details == null ? new JSObject() : details;
                  event.put("stage", stage);
                  event.put("message", message);
                  event.put("timestamp", System.currentTimeMillis());
                  notifyListeners("downloadLog", event);
              }

              private JSObject queryDownload(long id) {
                  JSObject result = new JSObject();
                  result.put("downloadId", id);
                  result.put("downloadUrl", pendingDownloadUrl);
                  result.put("checkedAt", System.currentTimeMillis());
                  if (id < 0) {
                      result.put("status", "NO_DOWNLOAD");
                      result.put("message", "No download has been queued in this app session.");
                      return result;
                  }

                  DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                  if (manager == null) {
                      result.put("status", "DOWNLOAD_SERVICE_UNAVAILABLE");
                      return result;
                  }

                  Cursor cursor = null;
                  try {
                      cursor = manager.query(new DownloadManager.Query().setFilterById(id));
                      if (cursor == null || !cursor.moveToFirst()) {
                          result.put("status", "NOT_FOUND");
                          result.put("message", "Android DownloadManager has no record for this download ID.");
                          return result;
                      }

                      int statusIndex = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                      int reasonIndex = cursor.getColumnIndex(DownloadManager.COLUMN_REASON);
                      int bytesIndex = cursor.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR);
                      int totalIndex = cursor.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES);
                      int uriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_URI);
                      int localUriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI);
                      int lastModifiedIndex = cursor.getColumnIndex(DownloadManager.COLUMN_LAST_MODIFIED_TIMESTAMP);
                      int status = statusIndex >= 0 ? cursor.getInt(statusIndex) : -1;
                      int reason = reasonIndex >= 0 ? cursor.getInt(reasonIndex) : 0;
                      long bytes = bytesIndex >= 0 ? cursor.getLong(bytesIndex) : -1L;
                      long total = totalIndex >= 0 ? cursor.getLong(totalIndex) : -1L;
                      result.put("status", statusLabel(status));
                      result.put("statusCode", status);
                      result.put("reason", reasonLabel(reason));
                      result.put("reasonCode", reason);
                      result.put("bytesDownloaded", bytes);
                      result.put("totalBytes", total);
                      if (uriIndex >= 0) result.put("requestedUri", cursor.getString(uriIndex));
                      if (localUriIndex >= 0) result.put("localUri", cursor.getString(localUriIndex));
                      if (lastModifiedIndex >= 0) result.put("lastModified", cursor.getLong(lastModifiedIndex));
                  } catch (Exception error) {
                      result.put("queryError", error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage()));
                  } finally {
                      if (cursor != null) cursor.close();
                  }
                  return result;
              }

              @PluginMethod
              public void getAppInfo(PluginCall call) {
                  try {
                      PackageInfo info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      JSObject result = new JSObject();
                      result.put("versionName", info.versionName == null ? "" : info.versionName);
                      result.put("versionCode", Build.VERSION.SDK_INT >= 28 ? (double) info.getLongVersionCode() : (double) info.versionCode);
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Unable to read the installed CryBots version.", error);
                  }
              }

              @PluginMethod
              public void getDownloadDiagnostics(PluginCall call) {
                  JSObject result = queryDownload(pendingDownloadId);
                  ConnectivityManager connectivity = (ConnectivityManager) getContext().getSystemService(Context.CONNECTIVITY_SERVICE);
                  try {
                      NetworkInfo active = connectivity == null ? null : connectivity.getActiveNetworkInfo();
                      result.put("networkConnected", active != null && active.isConnected());
                      result.put("networkType", active == null ? "NONE" : active.getTypeName());
                  } catch (Exception error) {
                      result.put("networkCheckError", error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage()));
                  }
                  result.put("androidVersion", Build.VERSION.RELEASE);
                  result.put("androidSdkInt", Build.VERSION.SDK_INT);
                  call.resolve(result);
              }

              @PluginMethod
              public void probeDownloadEndpoint(PluginCall call) {
                  String urlText = call.getString("url");
                  Uri parsed = urlText == null ? null : Uri.parse(urlText);
                  if (parsed == null || !"https".equalsIgnoreCase(parsed.getScheme()) ||
                          parsed.getHost() == null ||
                          !"crybots.kingshall.online".equalsIgnoreCase(parsed.getHost())) {
                      call.reject("The probe URL is not a trusted CryBots download URL.");
                      return;
                  }

                  new Thread(() -> {
                      HttpURLConnection connection = null;
                      try {
                          connection = (HttpURLConnection) new URL(urlText).openConnection();
                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(15000);
                          connection.setInstanceFollowRedirects(true);
                          connection.setRequestProperty("Range", "bytes=0-0");
                          connection.setRequestProperty("Accept", "application/vnd.android.package-archive");
                          connection.connect();
                          int code = connection.getResponseCode();
                          JSObject result = new JSObject();
                          result.put("httpStatus", code);
                          result.put("contentType", String.valueOf(connection.getContentType()));
                          result.put("contentLength", connection.getContentLengthLong());
                          result.put("contentDisposition", String.valueOf(connection.getHeaderField("Content-Disposition")));
                          result.put("finalUrl", String.valueOf(connection.getURL()));
                          result.put("acceptRanges", String.valueOf(connection.getHeaderField("Accept-Ranges")));
                          result.put("probeTimestamp", System.currentTimeMillis());
                          result.put("ok", code >= 200 && code < 300 &&
                                  connection.getContentType() != null &&
                                  connection.getContentType().toLowerCase().contains("application/vnd.android.package-archive"));
                          try {
                              if (code >= 400) {
                                  java.io.InputStream errorStream = connection.getErrorStream();
                                  if (errorStream != null) errorStream.close();
                              } else {
                                  java.io.InputStream input = connection.getInputStream();
                                  if (input != null) {
                                      input.read();
                                      input.close();
                                  }
                              }
                          } catch (Exception ignored) {}
                          call.resolve(result);
                      } catch (Exception error) {
                          JSObject result = new JSObject();
                          result.put("ok", false);
                          result.put("error", error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage()));
                          result.put("probeTimestamp", System.currentTimeMillis());
                          call.resolve(result);
                      } finally {
                          if (connection != null) connection.disconnect();
                      }
                  }, "CryBots-Apk-Probe").start();
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String url = call.getString("url");
                  Uri parsed = url == null ? null : Uri.parse(url);
                  if (parsed == null || !"https".equalsIgnoreCase(parsed.getScheme()) ||
                          parsed.getHost() == null ||
                          !"crybots.kingshall.online".equalsIgnoreCase(parsed.getHost())) {
                      call.reject("The update URL is not a trusted CryBots download URL.");
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                          !getContext().getPackageManager().canRequestPackageInstalls()) {
                      Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName()));
                      getActivity().startActivity(settings);
                      JSObject result = new JSObject();
                      result.put("requiresPermission", true);
                      call.resolve(result);
                      return;
                  }

                  DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                  if (manager == null) {
                      call.reject("Android's download service is unavailable.");
                      return;
                  }

                  try {
                      if (downloadReceiver != null) {
                          try { getContext().unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                          downloadReceiver = null;
                      }

                      pendingDownloadUrl = url;
                      emitLog("queued", "Preparing Android DownloadManager request.", null);
                      IntentFilter filter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                      downloadReceiver = new BroadcastReceiver() {
                          @Override public void onReceive(Context context, Intent intent) {
                              long completedId = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                              if (completedId != pendingDownloadId) return;

                              try { getContext().unregisterReceiver(this); } catch (Exception ignored) {}
                              downloadReceiver = null;

                              JSObject diagnostics = queryDownload(completedId);
                              String status = diagnostics.optString("status", "UNKNOWN");
                              String reason = diagnostics.optString("reason", "UNKNOWN");
                              if (!"SUCCESSFUL".equals(status)) {
                                  String message = "APK download failed: " + status + " / " + reason +
                                          " (HTTP/reason code " + diagnostics.optInt("reasonCode", 0) + ").";
                                  diagnostics.put("message", message);
                                  emitLog("failed", message, diagnostics);
                                  notifyListeners("downloadError", diagnostics);
                                  return;
                              }

                              emitLog("downloaded", "APK downloaded successfully; opening Android installer.", diagnostics);
                              Uri apkUri = manager.getUriForDownloadedFile(completedId);
                              if (apkUri == null) {
                                  JSObject failure = queryDownload(completedId);
                                  failure.put("message", "Android reported a successful download but returned no APK file URI.");
                                  emitLog("installer_error", failure.optString("message"), failure);
                                  notifyListeners("downloadError", failure);
                                  return;
                              }

                              Intent install = new Intent(Intent.ACTION_VIEW);
                              install.setDataAndType(apkUri, "application/vnd.android.package-archive");
                              install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              try {
                                  getActivity().startActivity(install);
                                  emitLog("installer_opened", "Android package installer opened.", diagnostics);
                              } catch (Exception error) {
                                  JSObject failure = queryDownload(completedId);
                                  failure.put("message", "Android could not launch the package installer: " + String.valueOf(error.getMessage()));
                                  emitLog("installer_error", failure.optString("message"), failure);
                                  notifyListeners("downloadError", failure);
                              }
                          }
                      };

                      if (Build.VERSION.SDK_INT >= 33) {
                          getContext().registerReceiver(downloadReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          getContext().registerReceiver(downloadReceiver, filter);
                      }

                      DownloadManager.Request request = new DownloadManager.Request(parsed);
                      request.setTitle("CryBots update");
                      request.setDescription("Downloading the latest CryBots APK.");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(false);
                      request.setDestinationInExternalFilesDir(getContext(), Environment.DIRECTORY_DOWNLOADS,
                              "CryBots-update-" + System.currentTimeMillis() + ".apk");
                      pendingDownloadId = manager.enqueue(request);

                      JSObject result = new JSObject();
                      result.put("status", "downloading");
                      result.put("downloadId", (double) pendingDownloadId);
                      result.put("url", url);
                      result.put("queuedAt", System.currentTimeMillis());
                      emitLog("started", "Android DownloadManager accepted the request.", result);
                      call.resolve(result);
                  } catch (Exception error) {
                      if (downloadReceiver != null) {
                          try { getContext().unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                          downloadReceiver = null;
                      }
                      JSObject failure = new JSObject();
                      failure.put("message", "Unable to start the APK download: " + String.valueOf(error.getMessage()));
                      failure.put("error", error.getClass().getSimpleName());
                      emitLog("start_error", failure.optString("message"), failure);
                      call.reject(failure.optString("message"), error);
                  }
              }

              @Override
              protected void handleOnDestroy() {
                  if (downloadReceiver != null) {
                      try { getContext().unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                      downloadReceiver = null;
                  }
                  super.handleOnDestroy();
              }
          }
          JAVA

          cat > android/app/src/main/java/com/kingshall/exchange/MainActivity.java <<'JAVA'
          package com.kingshall.exchange;

          import android.os.Bundle;
          import android.media.AudioManager;
          import android.util.Log;

          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewFeature;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaAudioPlugin.class);
                  registerPlugin(WebAuthnDiagnosticsPlugin.class);
                  registerPlugin(NativeWebAuthnPlugin.class);
                  registerPlugin(NativeAppUpdatePlugin.class);
                  super.onCreate(savedInstanceState);

                  AudioManager audioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
                  if (audioManager != null) {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  }

                  // WebView disables WebAuthn by default. Explicitly enable the
                  // app-scoped WebAuthn bridge when the installed WebView supports it.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.WEB_AUTHENTICATION)) {
                      WebSettingsCompat.setWebAuthenticationSupport(
                              getBridge().getWebView().getSettings(),
                              WebSettingsCompat.WEB_AUTHENTICATION_SUPPORT_FOR_APP
                      );
                      Log.i("CryBotsWebAuthn", "WebAuthn support: " +
                              WebSettingsCompat.getWebAuthenticationSupport(
                                      getBridge().getWebView().getSettings()));
                  } else {
                      Log.w("CryBotsWebAuthn", "Installed Android WebView does not support WebAuthn.");
                  }
              }
          }
