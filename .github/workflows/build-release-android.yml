name: Build Production Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download or generate release keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          run_id="$(gh run list --workflow generate-release-keystore.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$run_id" ] && gh run download "$run_id" --name kingshall-release-signing-files --dir signing \
            && [ -f signing/kingshall-release.keystore ]; then
            echo "Downloaded the latest release signing artifact."
          else
            echo "Release signing artifact unavailable; generating a temporary release keystore."
            keystore_password="$(openssl rand -hex 24)"
            key_password="$keystore_password"
            keytool -genkeypair \
              -keystore signing/kingshall-release.keystore \
              -alias kingshall \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$keystore_password" \
              -storetype PKCS12 \
              -keypass "$key_password" \
              -dname "CN=KingsHall Exchange, OU=Mobile, O=KingsHall Exchange, L=Unknown, ST=Unknown, C=US"
            printf 'ANDROID_KEY_ALIAS=kingshall\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\n' "$keystore_password" "$key_password" > signing/kingshall-signing-credentials.txt
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@7.6.9 @capacitor/android@7.6.9 @capacitor/cli@7.6.9 @capacitor/assets@3.0.5 @capacitor/splash-screen@7.0.3 @capacitor-community/speech-recognition@7.0.1 @capacitor-community/text-to-speech@6.0.0 sharp

      - name: Create app branding assets
        run: |
          mkdir -p assets
          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const source = fs.readFileSync('public/icons/ke-icon.svg', 'utf8');
          const logo = source.replace(
            /<svg[^>]*>/,
            '<svg width="400" height="400" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">',
          );
          const crown = logo.replace(/<rect[^>]*\/>/, '');
          const splash = `<svg width="2732" height="2732" viewBox="0 0 2732 2732" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><rect width="2732" height="2732" fill="#000000"/><rect x="1181" y="1181" width="370" height="370" rx="88" fill="#111827"/><g transform="translate(1366 1366) scale(0.64 0.56) translate(-256 -256)">${crown.replace('<svg', '<g').replace('</svg>', '</g>')}</g></svg>`;
          fs.writeFileSync('assets/splash.svg', splash);
          fs.writeFileSync('assets/crown.svg', logo);
          sharp('public/icons/ke-icon.svg').resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon-only.png')
            .then(() => sharp('assets/crown.svg').resize(1024, 1024, { fit: 'contain' }).png().toFile('assets/icon-foreground.png'))
            .then(() => sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#111827' } }).png().toFile('assets/icon-background.png'))
            .then(() => sharp('assets/splash.svg').png().toFile('assets/splash.png'))
            .catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Build web app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://kingshalls.onrender.com' }}

      - name: Create Android project and generate branding
        run: |
          npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(file, 'utf8');
          const permissions = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'];
          const missing = permissions.filter(permission => !manifest.includes(permission));
          if (missing.length) {
            const lines = missing.map(permission => `    <uses-permission android:name="${permission}" />`).join('\n');
            manifest = manifest.replace(/(<manifest[^>]*>\n)/, `$1${lines}\n`);
          }
          if (!manifest.includes('android.speech.RecognitionService')) {
            const queries = '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n';
            manifest = manifest.replace(/(<manifest[^>]*>\n)/, `$1${queries}`);
          }
          fs.writeFileSync(file, manifest);
          NODE
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Configure release signing
        run: |
          set -euo pipefail
          # Always use credentials distributed with the keystore. Using repository secrets
          # here can pair a stale password with a newly downloaded signing artifact.
          test -f signing/kingshall-signing-credentials.txt
          source signing/kingshall-signing-credentials.txt
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"
          cp signing/kingshall-release.keystore android/app/kingshall-release.keystore
          cat >> android/gradle.properties <<EOF
          KINGS_HALL_KEYSTORE_FILE=kingshall-release.keystore
          KINGS_HALL_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          KINGS_HALL_KEY_ALIAS=$ANDROID_KEY_ALIAS
          KINGS_HALL_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("KINGS_HALL_KEYSTORE_FILE"))
                      storePassword project.findProperty("KINGS_HALL_KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("KINGS_HALL_KEY_ALIAS")
                      keyPassword project.findProperty("KINGS_HALL_KEY_PASSWORD")
                  }
              }
          '''
          text = text.replace('    buildTypes {', signing + '\n    buildTypes {', 1)
          build_types_start = text.index('    buildTypes {')
          release_start = text.index('        release {', build_types_start)
          signing_line = '        release {\n            signingConfig signingConfigs.release'
          text = text[:release_start] + text[release_start:].replace('        release {', signing_line, 1)
          path.write_text(text)
          PY

      - name: Build signed production APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
