name: Build Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the CryBots production APK'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: crybots-release-apk
  cancel-in-progress: true

jobs:
  build-release:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CryBots
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm ci

      - name: Install pinned Android build dependencies
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7.6.9 \
            @capacitor/android@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/assets@3.0.5 \
            @capacitor/splash-screen@7.0.3 \
            @capacitor-community/text-to-speech@6.0.0 \
            sharp

      - name: Verify CryBots web build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://kingshalls.onrender.com' }}
        run: npm run build

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Add Android WebAuthn and Credential Manager support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          deps = '''\n    implementation "androidx.webkit:webkit:1.14.0"\n    implementation "androidx.credentials:credentials:1.6.0"\n    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"\n'''
          marker = "dependencies {\n"
          if marker not in text:
              raise SystemExit("Could not find Android dependencies block")
          if "androidx.webkit:webkit" not in text:
              text = text.replace(marker, marker + deps, 1)
          path.write_text(text)
          PY

      - name: Configure Android media audio routing for voice mode
        run: |
          mkdir -p android/app/src/main/java/com/kingshall/exchange
          cat > android/app/src/main/java/com/kingshall/exchange/MediaAudioPlugin.java <<'JAVA'
          package com.kingshall.exchange;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.os.Build;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.PluginMethod;

          @CapacitorPlugin(name = "MediaAudio")
          public class MediaAudioPlugin extends Plugin {
              private AudioManager audioManager;
              private AudioFocusRequest audioFocusRequest;

              private AudioManager getAudioManager() {
                  if (audioManager == null) {
                      audioManager = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                  }
                  return audioManager;
              }

              @PluginMethod
              public void prepareMediaOutput(PluginCall call) {
                  AudioManager manager = getAudioManager();
                  if (manager == null) {
                      call.resolve();
                      return;
                  }

                  // WebView microphone capture can leave Android in communication/call mode.
                  // Deepgram TTS is normal media playback, so explicitly restore MODE_NORMAL.
                  manager.setMode(AudioManager.MODE_NORMAL);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      AudioAttributes attributes = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build();

                      audioFocusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                              .setAudioAttributes(attributes)
                              .setAcceptsDelayedFocusGain(false)
                              .build();

                      manager.requestAudioFocus(audioFocusRequest);
                  } else {
                      manager.requestAudioFocus(
                              null,
                              AudioManager.STREAM_MUSIC,
                              AudioManager.AUDIOFOCUS_GAIN_TRANSIENT
                      );
                  }

                  call.resolve(new JSObject());
              }

              @PluginMethod
              public void releaseMediaOutput(PluginCall call) {
                  AudioManager manager = getAudioManager();
                  if (manager != null) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && audioFocusRequest != null) {
                          manager.abandonAudioFocusRequest(audioFocusRequest);
                          audioFocusRequest = null;
                      } else {
                          manager.abandonAudioFocus(null);
                      }
                      manager.setMode(AudioManager.MODE_NORMAL);
                  }
                  call.resolve(new JSObject());
              }
          }
          JAVA

          cat > android/app/src/main/java/com/kingshall/exchange/MainActivity.java <<'JAVA'
          package com.kingshall.exchange;

          import android.os.Bundle;
          import android.media.AudioManager;
          import android.util.Log;

          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewFeature;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaAudioPlugin.class);
                  super.onCreate(savedInstanceState);

                  AudioManager audioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
                  if (audioManager != null) {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  }

                  // WebView disables WebAuthn by default. Explicitly enable the
                  // app-scoped WebAuthn bridge when the installed WebView supports it.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.WEB_AUTHENTICATION)) {
                      WebSettingsCompat.setWebAuthenticationSupport(
                              getBridge().getWebView().getSettings(),
                              WebSettingsCompat.WEB_AUTHENTICATION_SUPPORT_FOR_APP
                      );
                      Log.i("CryBotsWebAuthn", "WebAuthn support: " +
                              WebSettingsCompat.getWebAuthenticationSupport(
                                      getBridge().getWebView().getSettings()));
                  } else {
                      Log.w("CryBotsWebAuthn", "Installed Android WebView does not support WebAuthn.");
                  }
              }
          }
          JAVA

      - name: Add required Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          marker = "</manifest>"
          additions = "".join(
              f'    <uses-permission android:name="{permission}" />\n'
              for permission in permissions
              if f'android:name="{permission}"' not in text
          )

          if additions:
              text = text.replace(marker, additions + marker)

          path.write_text(text)
          PY

      - name: Generate CryBots native assets
        run: |
          mkdir -p assets
          cp public/icons/android-icon.svg assets/icon.svg
          cp public/icons/android-splash.svg assets/splash.svg
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android 12+ CryBots splash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values-v31

          cat > android/app/src/main/res/values-v31/crybots_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/crybots_splash_background</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/crybots_splash_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML

          cat > android/app/src/main/res/drawable/crybots_splash_icon.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="288dp"
              android:height="288dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#000000"
                  android:pathData="M202,32 H310 C410,32 480,102 480,202 V310 C480,410 410,480 310,480 H202 C102,480 32,410 32,310 V202 C32,102 102,32 202,32 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4.5" android:fillColor="@android:color/transparent" android:pathData="M229,79 C252.2,79 271,158.2 271,256 C271,353.8 252.2,433 229,433 C205.8,433 187,353.8 187,256 C187,158.2 205.8,79 229,79 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="5.5" android:fillColor="@android:color/transparent" android:pathData="M256,79 C279.2,79 298,158.2 298,256 C298,353.8 279.2,433 256,433 C232.8,433 214,353.8 214,256 C214,158.2 232.8,79 256,79 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4.5" android:fillColor="@android:color/transparent" android:pathData="M283,79 C306.2,79 325,158.2 325,256 C325,353.8 306.2,433 283,433 C259.8,433 241,353.8 241,256 C241,158.2 259.8,79 283,79 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="5.5" android:fillColor="@android:color/transparent" android:pathData="M79,230 C79,206.2 158.2,187 256,187 C353.8,187 433,206.2 433,230 C433,253.8 353.8,273 256,273 C158.2,273 79,253.8 79,230 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4.5" android:fillColor="@android:color/transparent" android:pathData="M79,256 C79,232.2 158.2,213 256,213 C353.8,213 433,232.2 433,256 C433,279.8 353.8,299 256,299 C158.2,299 79,279.8 79,256 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4.5" android:fillColor="@android:color/transparent" android:pathData="M79,282 C79,258.2 158.2,239 256,239 C353.8,239 433,258.2 433,282 C433,305.8 353.8,325 256,325 C158.2,325 79,305.8 79,282 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M280,256 C280,269.3 269.3,280 256,280 C242.7,280 232,269.3 232,256 C232,242.7 242.7,232 256,232 C269.3,232 280,242.7 280,256 Z" />
          </vector>
          XML

          cat > android/app/src/main/res/values/crybots_splash_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="crybots_splash_background">#050817</color>
          </resources>
          XML


      - name: Prepare release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing

          run_id="$(gh run list \
            --workflow generate-release-keystore.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$run_id" ]; then
            echo "::error::No successful release signing workflow was found."
            echo "Run 'Generate Android Release Keystore' once before building the production APK."
            exit 1
          fi

          gh run download "$run_id" \
            --name kingshall-release-signing-files \
            --dir signing

          test -f signing/kingshall-release.keystore
          test -f signing/kingshall-signing-credentials.txt

          cp signing/kingshall-release.keystore android/app/kingshall-release.keystore

          set -a
          source signing/kingshall-signing-credentials.txt
          set +a

          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"

          cat >> android/gradle.properties <<EOF
          CRYBOTS_KEYSTORE_FILE=kingshall-release.keystore
          CRYBOTS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          CRYBOTS_KEY_ALIAS=$ANDROID_KEY_ALIAS
          CRYBOTS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Define the release signing configuration once, before buildTypes.
          if "signingConfigs {" not in text:
              signing_block = """    signingConfigs {
              release {
                  storeFile file(project.findProperty("CRYBOTS_KEYSTORE_FILE"))
                  storePassword project.findProperty("CRYBOTS_KEYSTORE_PASSWORD")
                  keyAlias project.findProperty("CRYBOTS_KEY_ALIAS")
                  keyPassword project.findProperty("CRYBOTS_KEY_PASSWORD")
              }
          }

          """
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Could not find Android buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)

          # Attach the signing configuration to the release build type.
          # Do not put signingConfig inside signingConfigs.release itself.
          build_types = re.search(r"(?ms)^    buildTypes {.*$", text)
          if not build_types:
              raise SystemExit("Could not find Android buildTypes block")

          build_text = build_types.group(0)
          release_match = re.search(r"(?m)^        release {\n", build_text)
          if not release_match:
              raise SystemExit("Could not find release build type")

          release_start = release_match.end()
          release_body_end = build_text.find("\n        }", release_start)
          if release_body_end == -1:
              raise SystemExit("Could not find end of release build type")

          release_body = build_text[release_start:release_body_end]
          if "signingConfig signingConfigs.release" not in release_body:
              build_text = (
                  build_text[:release_start]
                  + "            signingConfig signingConfigs.release\n"
                  + build_text[release_start:]
              )

          text = text[:build_types.start()] + build_text
          path.write_text(text)
          PY

      - name: Build signed CryBots production APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload CryBots production APK
        uses: actions/upload-artifact@v4
        with:
          name: crybots-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
