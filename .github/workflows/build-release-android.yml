          cat > android/app/src/main/res/drawable/crybots_launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/crybots_splash_background" />
              <item
                  android:width="94dp"
                  android:height="94dp"
                  android:gravity="center"
                  android:drawable="@drawable/crybots_splash_logo" />
              <item
                  android:width="160dp"
                  android:height="64dp"
                  android:gravity="center|bottom"
                  android:bottom="51dp"
                  android:drawable="@drawable/crybots_branding" />
          </layer-list>
          XML

          cat > android/app/src/main/res/values/crybots_splash_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="crybots_splash_background">#050817</color>
          </resources>
          XML

          cat > android/app/src/main/res/values-v31/crybots_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowSplashScreenBackground">@color/crybots_splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/crybots_splash_logo_v31</item>
                  <item name="android:windowSplashScreenBrandingImage">@drawable/crybots_branding</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/styles.xml")
          text = path.read_text()
          pattern = re.compile(r'(?s)<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>')
          replacement = """<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:windowBackground">@drawable/crybots_launch_background</item>
              <item name="windowSplashScreenBackground">@color/crybots_splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/crybots_splash_logo</item>
              <item name="android:windowSplashScreenBrandingImage">@drawable/crybots_branding</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
          </style>"""
          if not pattern.search(text):
              raise SystemExit("Could not find Capacitor AppTheme.NoActionBarLaunch")
          path.write_text(pattern.sub(lambda _: replacement, text, count=1))
          PY

      - name: Prepare release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing

          run_id="$(gh run list \
            --workflow generate-release-keystore.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$run_id" ]; then
            echo "::error::No successful release signing workflow was found."
            echo "Run 'Generate Android Release Keystore' once before building the production APK."
            exit 1
          fi

          gh run download "$run_id" \
            --name kingshall-release-signing-files \
            --dir signing

          test -f signing/kingshall-release.keystore
          test -f signing/kingshall-signing-credentials.txt

          cp signing/kingshall-release.keystore android/app/kingshall-release.keystore

          set -a
          source signing/kingshall-signing-credentials.txt
          set +a

          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"

          cat >> android/gradle.properties <<EOF
          CRYBOTS_KEYSTORE_FILE=kingshall-release.keystore
          CRYBOTS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          CRYBOTS_KEY_ALIAS=$ANDROID_KEY_ALIAS
          CRYBOTS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Define the release signing configuration once, before buildTypes.
          if "signingConfigs {" not in text:
              signing_block = """    signingConfigs {
              release {
                  storeFile file(project.findProperty("CRYBOTS_KEYSTORE_FILE"))
                  storePassword project.findProperty("CRYBOTS_KEYSTORE_PASSWORD")
                  keyAlias project.findProperty("CRYBOTS_KEY_ALIAS")
                  keyPassword project.findProperty("CRYBOTS_KEY_PASSWORD")
              }
          }

          """
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Could not find Android buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)

          # Attach the signing configuration to the release build type.
          # Do not put signingConfig inside signingConfigs.release itself.
          build_types = re.search(r"(?ms)^    buildTypes {.*$", text)
          if not build_types:
              raise SystemExit("Could not find Android buildTypes block")

          build_text = build_types.group(0)
          release_match = re.search(r"(?m)^        release {\n", build_text)
          if not release_match:
              raise SystemExit("Could not find release build type")

          release_start = release_match.end()
          release_body_end = build_text.find("\n        }", release_start)
          if release_body_end == -1:
              raise SystemExit("Could not find end of release build type")

          release_body = build_text[release_start:release_body_end]
          if "signingConfig signingConfigs.release" not in release_body:
              build_text = (
                  build_text[:release_start]
                  + "            signingConfig signingConfigs.release\n"
                  + build_text[release_start:]
              )

          text = text[:build_types.start()] + build_text
          path.write_text(text)
          PY

      - name: Build signed CryBots production APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" CryBots.apk
          test -s CryBots.apk
          ls -lh CryBots.apk

      - name: Upload CryBots production APK
        uses: actions/upload-artifact@v4
        with:
          name: crybots-release-apk
          path: CryBots.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify release publishing credentials
        env:
          GH_TOKEN: ${{ secrets.CRYBOTS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing repository secret CRYBOTS_RELEASE_TOKEN."
            echo "Create a fine-grained token for this repository with Contents: Read and write, then add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Dedicated release token is configured."

      - name: Publish CryBots GitHub Release
        env:
          GH_TOKEN: ${{ secrets.CRYBOTS_RELEASE_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new app_version so every APK has a unique release tag."
            exit 1
          fi

          gh release create "$tag" CryBots.apk \
            --target "$GITHUB_SHA" \
            --title "CryBots $APP_VERSION" \
            --notes "CryBots Android release $APP_VERSION.

          Download CryBots.apk and install it to update the existing app. Android may ask you to confirm installation."
      - name: Notify CryBots users about this release
        env:
          API_URL: ${{ vars.CRYBOTS_API_URL || 'https://kingshalls.onrender.com' }}
          RELEASE_SECRET: ${{ secrets.CRYBOTS_RELEASE_WEBHOOK_SECRET }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SECRET" ]; then
            echo "::error::Set CRYBOTS_RELEASE_WEBHOOK_SECRET in GitHub Actions secrets and Render environment variables."
            exit 1
          fi
          payload="$(jq -n --arg tag "v$APP_VERSION" '{tag: $tag}')"
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error \
              --request POST "$API_URL/api/notifications/release-published" \
              --header "Content-Type: application/json" \
              --header "X-CryBots-Release-Secret: $RELEASE_SECRET" \
              --data "$payload"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error::Release was published, but notifying CryBots users failed after 5 attempts."
          exit 1