      - name: Configure unified CryBots native launch splash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/values android/app/src/main/res/values-v31

          # Keep the 92px circle holder, but enlarge the foreground orbital artwork to 1.3x:
          # 72px -> 94px on legacy Android; Android 12+ scales the same artwork to 166px.
          # The background circle remains unchanged.
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');

          (async () => {
            let svg = fs.readFileSync('public/icons/crybots-app-icon.svg', 'utf8');
            const backgroundCircle = /<circle\s+cx="256"\s+cy="256"\s+r="363"\s+fill="#000000"\s*\/>/;
            if (!backgroundCircle.test(svg)) {
              throw new Error('CryBots master icon changed; cannot safely isolate its splash artwork.');
            }
            // Remove the app-icon backdrop: splash circle dimensions are composed separately.
            svg = svg.replace(backgroundCircle, '');
            const artwork = Buffer.from(svg);

            // Exact same displayed sizing for every Android version: 92dp circle + 72dp artwork.
            const holderDp = 92;
            const artworkDp = 94;
            const legacyHolderPx = holderDp;
            const legacyArtworkPx = artworkDp;
            const systemCanvasPx = 512;
            const systemCanvasDp = 288;
            const systemHolderPx = Math.round(holderDp / systemCanvasDp * systemCanvasPx);
            const systemArtworkPx = Math.round(artworkDp / systemCanvasDp * systemCanvasPx);
            if (systemHolderPx !== 164 || systemArtworkPx !== 167) {
              throw new Error('CryBots Android 12+ splash scale must preserve the 92dp circle and 1.3x artwork.');
            }

            // Android 11 and below: keep the 92px circle and center the 1.3x artwork image.
            const legacyArtwork = await sharp(artwork).resize(legacyArtworkPx, legacyArtworkPx).png().toBuffer();
            await sharp({ create: { width: legacyArtworkPx, height: legacyArtworkPx, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([
                { input: Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="94" height="94"><circle cx="47" cy="47" r="46" fill="#000000"/></svg>'), left: 0, top: 0 },
                { input: legacyArtwork, left: 0, top: 0 }
              ])
              .png().toFile('android/app/src/main/res/drawable-nodpi/crybots_splash_logo.png');

            // Android 12+: use the same dimensions converted to pixels for the 512px system canvas.
            const systemArtwork = await sharp(artwork).resize(systemArtworkPx, systemArtworkPx).png().toBuffer();
            const systemHolder = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="164" height="164"><circle cx="82" cy="82" r="82" fill="#000000"/></svg>');
            const systemHolderLayer = await sharp(systemHolder).png().toBuffer();
            await sharp({ create: { width: systemCanvasPx, height: systemCanvasPx, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([
                { input: systemHolderLayer, left: Math.round((systemCanvasPx - systemHolderPx) / 2), top: Math.round((systemCanvasPx - systemHolderPx) / 2) },
                { input: systemArtwork, left: Math.round((systemCanvasPx - systemArtworkPx) / 2), top: Math.round((systemCanvasPx - systemArtworkPx) / 2) }
              ])
              .png().toFile('android/app/src/main/res/drawable-nodpi/crybots_splash_logo_v31.png');

            const branding = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><rect width="800" height="320" fill="none"/><text x="400" y="174" text-anchor="middle" fill="#FFFFFF" font-family="STIX Two Text, serif" font-size="72" font-weight="700" letter-spacing="3">CryBots</text></svg>');
            await sharp(branding).png().toFile('android/app/src/main/res/drawable-nodpi/crybots_branding.png');

            const audit = await sharp('android/app/src/main/res/drawable-nodpi/crybots_splash_logo.png').ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const alphaAt = (x, y) => audit.data[(y * audit.info.width + x) * audit.info.channels + 3];
            if (audit.info.width !== 94 || audit.info.height !== 94 || alphaAt(0, 0) !== 0 || alphaAt(47, 2) === 0 || alphaAt(47, 47) === 0) {
              throw new Error('CryBots 94px artwork canvas / 92px circle splash composition failed validation.');
            }
            console.log('Created and validated CryBots splash: 92px circle holder + 94px orbital artwork on legacy Android; 164px holder + 167px artwork on Android 12+.');
          })().catch(error => { console.error(error); process.exit(1); });
